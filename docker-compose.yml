services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  simulator:
    build: .
    command: python -m monitor.simulator
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped

  collector:
    build: .
    command: python -m monitor.collector
    environment:
      MQTT_HOST: mosquitto
      DB_PATH: /app/data/readings.db
    volumes:
      - monitor-data:/app/data
    depends_on:
      - mosquitto
    restart: unless-stopped

  dashboard:
    build: .
    command: python -mstreamlit run monitor/dashboard.py --server.address=0.0.0.0
    environment:
      DB_PATH: /app/data/readings.db
    volumes:
      - monitor-data:/app/data
    ports:
      - "8501:8501"
    depends_on:
      - collector
    restart: unless-stopped
  
volumes:
  monitor-data: